[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "late-delivery-auditor"
version = "0.1.0"
description = "Find FedEx/UPS/USPS packages that qualify for guaranteed-service (money-back guarantee) refund claims."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brett Prejeant" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7"]

[project.scripts]
late-audit = "late_delivery_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
late_delivery_auditor = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
